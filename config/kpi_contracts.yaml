# Aletheia — KPI contracts with V4 generic cadence + mechanism semantics.
# No region/date/scenario-specific rules. Direction semantics are business-contract metadata.

revenue:
  formula: revenue = units_sold * average_selling_price
  components:
  - name: units_sold
    table: mart.daily_kpi_evidence
    column: units_sold
  - name: average_selling_price
    table: mart.daily_kpi_evidence
    column: average_selling_price
  root_drivers:
  - name: competitor_price_index
    table: mart.daily_kpi_evidence
    column: competitor_price_index
    explains: average_selling_price
    max_lag: 14
    source_cadence_days: 7
    causal_role: context
    expected_effect_sign: positive
  - name: marketing_spend
    table: mart.daily_kpi_evidence
    column: marketing_spend
    explains: units_sold
    max_lag: 7
    source_cadence_days: 1
    causal_role: direct
    expected_effect_sign: positive
  - name: stock_availability
    table: mart.daily_kpi_evidence
    column: stock_availability
    explains: units_sold
    max_lag: 3
    source_cadence_days: 1
    causal_role: direct
    expected_effect_sign: positive
  - name: weather_index
    table: mart.daily_kpi_evidence
    column: weather_index
    explains: units_sold
    max_lag: 7
    source_cadence_days: 7
    causal_role: context
    expected_effect_sign: positive
  - name: average_discount_pct
    table: mart.daily_kpi_evidence
    column: average_discount_pct
    explains: average_selling_price
    max_lag: 0
    source_cadence_days: 1
    causal_role: direct
    expected_effect_sign: negative
conversion_rate:
